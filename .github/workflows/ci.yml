name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test Matrix (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Verify Ruleset Cryptographic Hashes
        run: ./scripts/sha256sums.sh verify

      - name: Run Full Test Suite
        run: npm test

      - name: Run Dedicated Security Test Suite
        run: npm run test:security

      - name: Run CLI Binary Tests
        run: npm run test:cli

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Run Performance Regression Gate
        run: npm run test:perf

  package-smoke-test:
    name: Package Smoke Installation Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Package Smoke Test
        run: npm run test:smoke

  release-gate-validation:
    name: 18-Check Release Gate Validation
    runs-on: ubuntu-latest
    needs: [test-matrix, package-smoke-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Validate Suite Bundles
        run: npm run validate:suite

      - name: Validate Skill & Plugin Schemas
        run: npm run validate:schema

      - name: Validate Agent Capabilities
        run: npm run validate:capabilities

      - name: Validate Documentation SSOT
        run: npm run validate:docs

      - name: Run Deterministic Engine Benchmark
        run: npm run benchmark

      - name: Execute 18-Check Release Gate
        run: npm run validate:release
